name: Feature request
description: Propose an improvement to Matcha for macOS
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the developer workflow or compatibility problem to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: protocol-impact
    attributes:
      label: Protocol impact
      description: Note any OneBot or Milky compatibility implications.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
