name: Bug report
description: Report a reproducible problem in Matcha for macOS
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: app-version
    attributes:
      label: Matcha version
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.0, MacBook Pro (Apple silicon)
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - OneBot V11
        - OneBot V12
        - Milky 1.3
        - Not protocol-specific
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Connect ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional context
      description: Remove access tokens, message content, raw protocol payloads, file paths, and personal data before attaching logs.
